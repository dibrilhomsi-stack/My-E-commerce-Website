<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terra's Shop - Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Terra's Shop </h1>
  <nav>
    <a href="index.html"> Home</a>
	<a href="search.html">Search </a>
    <a href="men.html">Men</a>
    <a href="women.html">Women</a>
    <a href="beauty.html">Beauty </a>
    <a href="contact.html">Contact</a>
	<a href="wishlist.html">Wishlist </a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<section>
  <h2>🔍 Search Products</h2>
  <input type="text" id="search-input" placeholder="Type a product name..." />
  <div class="products" id="search-results"></div>
</section>

<script>
// Sample product list (you can add more)
const products = [
  {name: "Casual Shirt", category: "Men", price: 19.99, img:"https://via.placeholder.com/200x220?text=Shirt"},
  {name: "Blue Jeans", category: "Men", price: 29.99, img:"https://via.placeholder.com/200x220?text=Jeans"},
  {name: "Floral Dress", category: "Women", price: 24.99, img:"https://via.placeholder.com/200x220?text=Dress"},
  {name: "Lipstick", category: "Beauty", price: 9.99, img:"https://via.placeholder.com/200x220?text=Lipstick"}
];

const input = document.getElementById('search-input');
const resultsDiv = document.getElementById('search-results');

input.addEventListener('input', function() {
  const query = input.value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(query));
  
  resultsDiv.innerHTML = filtered.map(p => `
    <div class="product">
      <img src="${p.img}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>$${p.price.toFixed(2)}</p>
      <button onclick="addToCart('${p.name}', ${p.price})">Add to Cart</button>
    </div>
  `).join('');
});

// Add to cart function (same as in your cart system)
function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  cart.push({name, price});
  localStorage.setItem('cart', JSON.stringify(cart));
  alert(name + " has been added to your cart!");
}
</script>

</body>
</html>
